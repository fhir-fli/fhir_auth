# Two packages: fhir_auth_core is pure Dart and is checked with the Dart SDK
# alone (no Flutter on this runner); fhir_auth is the Flutter package built
# on it.
#
# No `set -e` inside these steps' checks: each command exits on failure
# itself (found 2026-10-04: errexit inside an `if` condition let format and
# analyze failures pass).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fhir_auth_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Format, analyze & test fhir_auth_core (Dart SDK only)
        run: |
          dart pub get || exit 1
          dart format --output=none --set-exit-if-changed lib test || exit 1
          dart analyze --fatal-infos || exit 1
          dart test || exit 1
          # The same-window login's window and session storage, in Chrome,
          # which the ubuntu runner image ships.
          dart test --platform chrome test/web || exit 1

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fhir_auth
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format, analyze & test fhir_auth
        run: |
          flutter pub get || exit 1
          # Example apps are their own packages; analyze needs them
          # resolved too.
          for e in example/*/pubspec.yaml; do
            if [ -f "$e" ]; then
              (cd "$(dirname "$e")" && flutter pub get) || exit 1
            fi
          done
          dart format --output=none --set-exit-if-changed lib test example || exit 1
          flutter analyze || exit 1
          flutter test || exit 1
