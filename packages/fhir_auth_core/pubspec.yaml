name: fhir_auth_core
description: SMART on FHIR authentication in pure Dart (OAuth 2.0, PKCE, ID-token checks, backend services, same-window browser login), for every FHIR version. No Flutter; the Flutter package fhir_auth builds on it.
version: 0.15.0
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/fhir_auth/tree/main/packages/fhir_auth_core
issue_tracker: https://github.com/fhir-fli/fhir_auth/issues
documentation: https://pub.dev/documentation/fhir_auth_core/latest/

topics:
  - fhir
  - smart-on-fhir
  - healthcare
  - authentication
  - oauth2

environment:
  sdk: ^3.7.0

dependencies:
  crypto: ^3.0.7                 # PKCE and crypto operations
  http: ^1.6.0
  jose: ^0.3.5+2                 # JWT/JWK/JOSE implementation
  logging: ^1.3.0                # Audit logging
  meta: ^1.16.0                  # @visibleForTesting
  uuid: ^4.5.2                   # Generate state/nonce
  web: ^1.1.1                    # Same-window redirect: location, sessionStorage

dev_dependencies:
  build_runner: ^2.10.4          # Generates the mockito mocks
  mockito: ^5.6.1
  test: ^1.26.3
  very_good_analysis: ^10.1.0
